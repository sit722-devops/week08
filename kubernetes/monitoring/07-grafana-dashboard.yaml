apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
data:
  koalatech-monitoring.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "type": "stat",
          "title": "HTTP Requests by Backend Service",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (service) (koalatech_http_requests_total)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "Backend Request Rate",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (service) (rate(koalatech_http_requests_total[5m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "Backend P95 Request Duration",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(koalatech_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          }
        },
        {
          "type": "stat",
          "title": "Running Staging Pods",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"staging\",phase=\"Running\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 8
          }
        },
        {
          "type": "stat",
          "title": "Available Staging Deployment Replicas",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"staging\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 8
          }
        },
        {
          "type": "timeseries",
          "title": "Staging Container Restarts",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"staging\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 16
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 41,
      "tags": [
        "SIT722",
        "KoalaTech",
        "10.2D"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "KoalaTech - SIT722 Task 10.2D",
      "uid": "koalatech-10-2d",
      "version": 1
    }
