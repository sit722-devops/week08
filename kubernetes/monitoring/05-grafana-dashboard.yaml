apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: KoalaTech
        orgId: 1
        folder: KoalaTech
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
  koalatech-monitoring.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {
          "type": "timeseries",
          "title": "Production Available Replicas",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "sum by (deployment) (kube_deployment_status_replicas_available{namespace=\"production\"})", "legendFormat": "{{deployment}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "type": "stat",
          "title": "Ready Production Pods",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_ready{namespace=\"production\",condition=\"true\"})", "legendFormat": "Ready pods"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Container CPU Usage",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"production\",container!=\"\",image!=\"\"}[5m]))", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Container Memory Working Set",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"production\",container!=\"\",image!=\"\"})", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "type": "gauge",
          "title": "Node CPU Utilisation",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [{"refId": "A", "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Container Restarts",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [{"refId": "A", "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"production\"})", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        }
      ],
      "schemaVersion": 39,
      "tags": ["koalatech", "kubernetes", "prometheus"],
      "templating": {"list": []},
      "time": {"from": "now-15m", "to": "now"},
      "title": "KoalaTech Kubernetes Monitoring",
      "uid": "koalatech-monitoring",
      "version": 1
    }
