apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrollment-service
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enrollment-service
  template:
    metadata:
      labels:
        app: enrollment-service
    spec:
      containers:
        - name: enrollment-service
          image: placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: enrollments
            - name: POSTGRES_HOST
              value: enrollment-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              value: HS256

---
apiVersion: v1
kind: Service
metadata:
  name: enrollment-service
  namespace: staging
spec:
  selector:
    app: enrollment-service
  ports:
    - port: 8000
      targetPort: 8000