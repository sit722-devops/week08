name: Build & Push Images
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: ${{ vars.ACR_NAME }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OIDC login to Azure
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      # .github/workflows/build-and-push.yml
      - name: Build & push backend
        run: |
          docker build -t $ACR_NAME.azurecr.io/backend:${GITHUB_SHA} \
            -f backend/order_service/Dockerfile backend/order_service
          docker push $ACR_NAME.azurecr.io/backend:${GITHUB_SHA}

      - name: Build & push frontend
        run: |
          docker build -t $ACR_NAME.azurecr.io/frontend:${GITHUB_SHA} frontend
          docker push $ACR_NAME.azurecr.io/frontend:${GITHUB_SHA}

