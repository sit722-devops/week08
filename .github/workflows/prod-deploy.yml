name: Prod - deploy

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read
  actions: read

defaults:
  run:
    working-directory: week08

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: week10-rg
          cluster-name: week10-aks

      - uses: actions/checkout@v4

      - name: Ensure production namespace
        run: |
          kubectl get ns production || kubectl create ns production

      - name: Deploy all manifests
        run: kubectl -n production apply -f k8s/base/

      - name: Override images with commit SHA
        run: |
          IMAGE_SHA=${{ github.sha }}
          kubectl -n production set image deploy/product-service-w08e1 product-service-container=week10abhiacr.azurecr.io/product_service:$IMAGE_SHA
          kubectl -n production set image deploy/order-service-w08e1 order-service-container=week10abhiacr.azurecr.io/order_service:$IMAGE_SHA
          kubectl -n production set image deploy/frontend frontend-container=week10abhiacr.azurecr.io/frontend:$IMAGE_SHA

      - name: Wait for rollout
        run: |
          kubectl -n production rollout status deploy/product-service-w08e1 --timeout=300s
          kubectl -n production rollout status deploy/order-service-w08e1 --timeout=300s
          kubectl -n production rollout status deploy/frontend --timeout=300s
