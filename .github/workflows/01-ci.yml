name: 01 - CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================================================
  # Terraform Validation and Planning
  # =========================================================
  terraform-check:
    name: Terraform Validation and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialise Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate

      - name: Create Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -refresh=false \
            -input=false \
            -lock=false \
            -var-file="terraform.tfvars" \
            -out="task-10-2.tfplan"

  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: pytest -v

  # =========================================================
  # Build, Scan and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build, Scan and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    needs:
      - terraform-check
      - backend-test

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image with attestations
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Docker Scout vulnerability report
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          only-severities: critical,high
          exit-code: false
          summary: true

      - name: Docker Scout critical vulnerability review
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          only-severities: critical
          exit-code: false
          summary: true

      - name: Docker Scout recommendations
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: recommendations
          image: registry://${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Display published image
        run: |
          echo "Published image:"
          echo "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}"