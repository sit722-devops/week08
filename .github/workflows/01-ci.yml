name: 01 - CI

on:
  # =========================================================
  # Pull Request Validation
  # =========================================================
  pull_request:
    branches:
      - main

  # =========================================================
  # Main Branch CI
  # =========================================================
  push:
    branches:
      - main

  # Allow controlled manual execution from GitHub Actions.
  workflow_dispatch:

jobs:
  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v

  # =========================================================
  # Frontend Tests
  # =========================================================
  frontend-test:
    name: Test Frontend
    runs-on: ubuntu-latest

    env:
      VITE_USER_SERVICE_URL: http://localhost:8001
      VITE_STUDENT_SERVICE_URL: http://localhost:8002
      VITE_LECTURER_SERVICE_URL: http://localhost:8003
      VITE_COURSE_SERVICE_URL: http://localhost:8004
      VITE_ENROLLMENT_SERVICE_URL: http://localhost:8005

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm run test -- --run

  # =========================================================
  # Terraform Validation, Plan and Provisioning
  # Task 10.2D - Infrastructure as Code integration
  #
  # Pull Request:
  #   Init -> Format -> Validate -> Plan
  #
  # Main/Manual:
  #   Init -> Format -> Validate -> Plan -> Apply
  # =========================================================
  terraform-check:
    name: Terraform Validate, Plan and Apply
    runs-on: ubuntu-latest

    # terraform.tfvars is intentionally not committed.
    # Week10 values are supplied through TF_VAR_* variables.
    env:
      TF_VAR_resource_group_name: "sit722-week10-rg"
      TF_VAR_location: "Australia East"
      TF_VAR_acr_name: "sit722week10acr224848845"
      TF_VAR_aks_name: "sit722-week10-aks"
      TF_VAR_storage_account_name: "sit722w10storage224848"
      TF_VAR_aks_node_count: "1"
      TF_VAR_aks_vm_size: "Standard_D2s_v3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -------------------------------------------------------
      # Persistent Terraform state
      # -------------------------------------------------------
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=sit722-week10-tfstate-rg" \
            -backend-config="storage_account_name=sit722w10tfstate224848" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=week10-10.2d.tfstate"

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      # -------------------------------------------------------
      # Generate a saved Terraform plan.
      # -------------------------------------------------------
      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan

      # -------------------------------------------------------
      # Infrastructure provisioning
      #
      # Pull requests NEVER provision infrastructure.
      # Apply occurs only for main push or controlled
      # workflow_dispatch execution.
      # -------------------------------------------------------
      - name: Terraform Apply
        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        working-directory: terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Display Terraform Outputs
        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        working-directory: terraform
        run: |
          echo "===== TERRAFORM OUTPUTS ====="
          terraform output

          echo
          echo "===== TERRAFORM STATE ====="
          terraform state list

  # =========================================================
  # Build, Security Scan and Push Docker Images
  # Task 10.2D - Docker Scout integration
  # =========================================================
  build-scan-and-push:
    name: Build, Scan and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # Application tests AND Terraform infrastructure
    # provisioning/validation must succeed before images
    # are published.
    needs:
      - backend-test
      - frontend-test
      - terraform-check

    # Pull requests perform validation only.
    # Images are published for main or controlled manual runs.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Azure authentication
      # -------------------------------------------------------
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -------------------------------------------------------
      # Authenticate with Azure Container Registry
      # -------------------------------------------------------
      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name ${{ vars.ACR_NAME }}

      # -------------------------------------------------------
      # Build image locally before security analysis
      # -------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }} \
            ./${{ matrix.service }}

      # -------------------------------------------------------
      # Docker Hub authentication for Docker Scout
      #
      # Required repository secrets:
      #   DOCKERHUB_USERNAME
      #   DOCKERHUB_TOKEN
      # -------------------------------------------------------
      - name: Login to Docker Hub for Docker Scout
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------
      # Docker Scout vulnerability analysis BEFORE ACR push
      #
      # exit-code is false so identified vulnerabilities are
      # reported without preventing the assessment pipeline
      # from continuing. Remediation is demonstrated separately.
      # -------------------------------------------------------
      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          only-severities: critical,high
          write-comment: false
          exit-code: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Obtain Docker Scout remediation guidance
      # -------------------------------------------------------
      - name: Docker Scout remediation recommendations
        uses: docker/scout-action@v1
        with:
          command: recommendations
          image: local://${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          write-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Publish security-scanned image to ACR
      # -------------------------------------------------------
      - name: Push Docker image with commit SHA
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

      - name: Display published image
        run: |
          echo "Published image:"
          echo "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}"