name: 00b - Terraform Apply (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    name: Terraform plan + apply
    runs-on: ubuntu-latest

    environment:
      name: infrastructure

    defaults:
      run:
        working-directory: terraform

    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      ARM_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Export service principal for Terraform
        run: |
          echo "ARM_CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .clientId)" >> "$GITHUB_ENV"
          SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r .clientSecret)
          echo "::add-mask::$SECRET"
          echo "ARM_CLIENT_SECRET=$SECRET" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .tenantId)" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .subscriptionId)" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve -no-color tfplan
