name: 03 - Test Staging

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main

jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          admin: 'true'

      - name: Wait for staging frontend IP
        run: |
          for i in {1..30}; do
            FRONTEND_IP=$(kubectl get service frontend -n staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              echo "Staging frontend IP: $FRONTEND_IP"
              exit 0
            fi

            echo "Waiting for staging frontend IP..."
            sleep 10
          done

          echo "Unable to find staging frontend IP."
          kubectl get services -n staging
          exit 1

      - name: Test frontend
        run: curl --fail --retry 10 --retry-delay 5 "http://${{ env.FRONTEND_IP }}"