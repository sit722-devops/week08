name: 03 - Test Staging

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main

jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest

    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Record staging images
        run: |
          for deployment in frontend user-service student-service lecturer-service course-service enrollment-service; do
            kubectl rollout status deployment/"$deployment" -n staging --timeout=300s
          done
          kubectl get deployments frontend user-service student-service lecturer-service course-service enrollment-service \
            -n staging -o json | jq --sort-keys '
              .items | map(.metadata.name as $name | {
                key: $name,
                value: (.spec.template.spec.containers[] | select(.name == $name) | .image)
              }) | from_entries
            ' > "$RUNNER_TEMP/tested-images.json"

      - name: Wait for staging frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n staging \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for staging frontend IP..."

            sleep 10
          done

          echo "Unable to find staging frontend IP."
          exit 1

      - name: Test frontend
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            http://${{ env.FRONTEND_IP }}

      - name: Verify staging images have not changed
        run: |
          kubectl get deployments frontend user-service student-service lecturer-service course-service enrollment-service \
            -n staging -o json | jq --sort-keys '
              .items | map(.metadata.name as $name | {
                key: $name,
                value: (.spec.template.spec.containers[] | select(.name == $name) | .image)
              }) | from_entries
            ' > "$RUNNER_TEMP/current-images.json"
          diff "$RUNNER_TEMP/tested-images.json" "$RUNNER_TEMP/current-images.json"

      - name: Upload tested images
        uses: actions/upload-artifact@v4
        with:
          name: tested-images
          path: ${{ runner.temp }}/tested-images.json
          if-no-files-found: error
