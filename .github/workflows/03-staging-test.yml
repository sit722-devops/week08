
name: 03 - Test Staging

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main


jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest

    env:
      FRONTEND_IP: ""

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Wait for staging frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n staging \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for staging frontend IP..."

            sleep 10
          done

          echo "Unable to find staging frontend IP."
          exit 1

      - name: Test frontend
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            http://${{ env.FRONTEND_IP }}

      - name: Record tested image tag
        run: |
          IMAGE=$(kubectl get deployment frontend \
            -n staging \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="frontend")].image}')

          IMAGE_TAG="${IMAGE##*:}"

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected frontend image tag: $IMAGE_TAG"
            exit 1
          fi

          echo "$IMAGE_TAG" > tested-image-tag.txt
          echo "Validated staging image tag: $IMAGE_TAG"

      - name: Publish tested image tag
        uses: actions/upload-artifact@v4
        with:
          name: tested-image-tag
          path: tested-image-tag.txt
          retention-days: 3