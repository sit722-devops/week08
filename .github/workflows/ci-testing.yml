name: CI - testing
 
on:
  push:
    branches: ["testing"]
 
permissions:
  id-token: write
  contents: read
 
jobs:
  test-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      # Example Node.js tests (adapt if using Python/other stack)
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
 
      - name: Run backend tests (skip if not present)
        run: |
          if [ -f backend/package.json ]; then
            cd backend
            npm ci
            npm test -- --ci
          else
            echo "No backend/package.json found, skipping..."
          fi
 
      - name: Run frontend tests (skip if not present)
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm test -- --ci
          else
            echo "No frontend/package.json found, skipping..."
          fi
 
      # Azure login with OIDC
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Login to ACR
        run: az acr login --name week10abhiacr
 
      - name: Build & Push Product Service Image
        run: |
          IMAGE=${{ vars.ACR_LOGIN_SERVER }}/product_service:${{ github.sha }}
          docker build -t $IMAGE ./backend/product_service
          docker push $IMAGE
      
      - name: Build & Push Order Service Image
        run: |
          IMAGE=${{ vars.ACR_LOGIN_SERVER }}/order_service:${{ github.sha }}
          docker build -t $IMAGE ./backend/order_service
          docker push $IMAGE
      
      - name: Build & Push Frontend Image
        run: |
          IMAGE=${{ vars.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
          docker build -t $IMAGE ./frontend
          docker push $IMAGE