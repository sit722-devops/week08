name: 04 - Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy to Production

    # Production deployment is manual during the Week 10 task.
    if: ${{ github.event_name == 'workflow_dispatch' }}

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      # Read the exact frontend image that has already passed
      # deployment and smoke testing in staging.
      - name: Get tested image SHA from staging
        id: tested-image
        shell: bash
        run: |
          TESTED_IMAGE=$(kubectl get deployment frontend \
            -n staging \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          IMAGE_TAG="${TESTED_IMAGE##*:}"

          echo "Tested staging image: $TESTED_IMAGE"
          echo "Promoting image tag: $IMAGE_TAG"

          if [ -z "$IMAGE_TAG" ]; then
            echo "Unable to determine tested staging image tag."
            exit 1
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Verify that all six application deployments in staging
      # are running the exact same tested release.
      - name: Verify staging release consistency
        shell: bash
        run: |
          IMAGE_TAG="${{ steps.tested-image.outputs.image_tag }}"

          for deployment in \
            frontend \
            user-service \
            student-service \
            lecturer-service \
            course-service \
            enrollment-service
          do
            IMAGE=$(kubectl get deployment "$deployment" \
              -n staging \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "$deployment -> $IMAGE"

            case "$IMAGE" in
              *:"$IMAGE_TAG")
                echo "$deployment uses tested release $IMAGE_TAG"
                ;;
              *)
                echo "$deployment does not use tested release $IMAGE_TAG"
                exit 1
                ;;
            esac
          done

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/production/

      - name: Promote tested images to production
        shell: bash
        run: |
          IMAGE_TAG="${{ steps.tested-image.outputs.image_tag }}"

          echo "Promoting tested release $IMAGE_TAG to production"

          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:$IMAGE_TAG \
            -n production

          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:$IMAGE_TAG \
            -n production

          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:$IMAGE_TAG \
            -n production

          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:$IMAGE_TAG \
            -n production

          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:$IMAGE_TAG \
            -n production

          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:$IMAGE_TAG \
            -n production

      - name: Verify production rollouts
        shell: bash
        run: |
          for deployment in \
            frontend \
            user-service \
            student-service \
            lecturer-service \
            course-service \
            enrollment-service
          do
            kubectl rollout status deployment/$deployment \
              -n production \
              --timeout=300s
          done

      - name: Verify production image versions
        run: |
          kubectl get deployments -n production \
            -o custom-columns='DEPLOYMENT:.metadata.name,IMAGE:.spec.template.spec.containers[*].image'

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production