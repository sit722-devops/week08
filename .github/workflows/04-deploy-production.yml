name: 04 - Deploy to Production

# Continuous Deployment: production runs automatically after staging tests pass.
# Week 08 used manual workflow_dispatch. This task removes that human gate.
on:
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    env:
      ACR_SERVER: koalatechomacr847.azurecr.io
      AKS_CLUSTER: koalatechomaks847
      AKS_RG: koalatech-week06-ex2-rg

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $AKS_RG \
            --name $AKS_CLUSTER \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/

      # =====================================================================
      # Blue-Green release for the frontend (the user-facing entry point).
      # The idle colour is updated and smoke tested behind frontend-preview
      # before the live "frontend" Service selector is switched. If the smoke
      # test fails, the job stops here and the selector is never touched, so
      # production keeps serving the previous, known-good colour.
      # =====================================================================
      - name: Determine live and idle frontend colour
        id: colour
        run: |
          LIVE_COLOR=$(kubectl get service frontend -n production -o jsonpath='{.spec.selector.color}')
          if [ -z "$LIVE_COLOR" ]; then LIVE_COLOR=blue; fi

          if [ "$LIVE_COLOR" = "blue" ]; then
            IDLE_COLOR=green
          else
            IDLE_COLOR=blue
          fi

          echo "Live colour is $LIVE_COLOR, deploying to idle colour $IDLE_COLOR"
          echo "live=$LIVE_COLOR" >> "$GITHUB_OUTPUT"
          echo "idle=$IDLE_COLOR" >> "$GITHUB_OUTPUT"

      - name: Deploy new image to idle frontend colour
        run: |
          kubectl set image deployment/frontend-${{ steps.colour.outputs.idle }} \
            frontend=$ACR_SERVER/koalatech-frontend:${{ github.event.workflow_run.head_sha }} \
            -n production

          kubectl rollout status deployment/frontend-${{ steps.colour.outputs.idle }} \
            -n production \
            --timeout=300s

      - name: Point preview service at idle colour
        run: |
          kubectl patch service frontend-preview -n production \
            --type merge \
            -p '{"spec":{"selector":{"app":"frontend","color":"${{ steps.colour.outputs.idle }}"}}}'

      - name: Smoke test idle colour before switching production traffic
        run: |
          kubectl run smoke-test-${{ github.run_id }} \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 \
            -n production \
            --command -- curl --fail --retry 10 --retry-delay 5 --max-time 5 \
            http://frontend-preview.production.svc.cluster.local

      - name: Switch production traffic to new colour
        run: |
          kubectl patch service frontend -n production \
            --type merge \
            -p '{"spec":{"selector":{"app":"frontend","color":"${{ steps.colour.outputs.idle }}"}}}'

          echo "Production frontend now served by the ${{ steps.colour.outputs.idle }} deployment"

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=$ACR_SERVER/koalatech-user-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=$ACR_SERVER/koalatech-student-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=$ACR_SERVER/koalatech-lecturer-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=$ACR_SERVER/koalatech-course-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=$ACR_SERVER/koalatech-enrollment-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n production \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      - name: Show production resources
        run: |
          kubectl get pods -n production -l app=frontend --show-labels
          kubectl get service frontend frontend-preview -n production
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production