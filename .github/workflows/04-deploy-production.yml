name: 04 - Deploy to Production

on:
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

jobs:
  deploy-production:
    name: Promote validated staging to production
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    env:
      APP_SERVICE_NAME: koalatech-week08-webapp-226035073
      RESOURCE_GROUP: koalatech-week08-rg
      STAGING_SLOT: staging
      PRODUCTION_SLOT: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap staging into production
        run: |
          echo "Swapping ${STAGING_SLOT} slot into ${PRODUCTION_SLOT} slot"
          timeout 600s az webapp deployment slot swap \
            --name "$APP_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot "$STAGING_SLOT" \
            --target-slot "$PRODUCTION_SLOT"

      - name: Verify production endpoint
        run: |
          PROD_HOSTNAME=$(az webapp show \
            --name "$APP_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query defaultHostName \
            --output tsv)

          echo "Checking https://${PROD_HOSTNAME}"

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 30 \
            "https://${PROD_HOSTNAME}" \
            > /tmp/production-response.html; then

            echo "Production verification failed: the live endpoint did not respond successfully."
            echo "Rolling back to the previous production version using the slot swap."

            timeout 600s az webapp deployment slot swap \
              --name "$APP_SERVICE_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --slot "$STAGING_SLOT" \
              --target-slot "$PRODUCTION_SLOT"

            echo "Rollback swap completed."
            exit 1
          fi

          if ! grep -Eiq "<html|<!doctype html|KoalaTech|Login" /tmp/production-response.html; then
            echo "Production response did not match the expected HTML markers."
            echo "Rolling back to the previous production version using the slot swap."

            timeout 600s az webapp deployment slot swap \
              --name "$APP_SERVICE_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --slot "$STAGING_SLOT" \
              --target-slot "$PRODUCTION_SLOT"

            echo "Rollback swap completed."
            exit 1
          fi

          echo "Production verification passed."