name: 00 - Terraform Infrastructure

on:
  # Plan automatically whenever the infrastructure code changes
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/00-terraform.yml"

  pull_request:
    paths:
      - "terraform/**"

  # Manual run: "plan" (drift check) or "apply" (make the change)
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:

  # =========================================================
  # Format, validate and plan
  # =========================================================
  plan:
    name: Terraform fmt / validate / plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      ARM_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Export service principal for Terraform
        run: |
          CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .clientId)
          CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r .clientSecret)
          TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .tenantId)
          SUBSCRIPTION_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .subscriptionId)
          echo "::add-mask::$CLIENT_SECRET"
          echo "ARM_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$CLIENT_SECRET" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$TENANT_ID" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> "$GITHUB_ENV"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan > plan.txt
          EXIT_CODE=$?
          set -e
          cat plan.txt
          {
            echo "## Terraform plan"
            echo ""
            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "No changes - live Azure infrastructure matches the code."
            elif [ "$EXIT_CODE" -eq 2 ]; then
              echo "Changes detected:"
            fi
            echo '```'
            grep -E "Plan:|No changes|# azurerm|will be|must be" plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXIT_CODE" -eq 1 ]; then
            exit 1
          fi

  # =========================================================
  # Apply (manual only)
  # =========================================================
  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs:
      - plan

    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'

    # Add a required reviewer on this environment for an approval gate
    environment:
      name: infrastructure

    defaults:
      run:
        working-directory: terraform

    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      ARM_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Export service principal for Terraform
        run: |
          CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .clientId)
          CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r .clientSecret)
          TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .tenantId)
          SUBSCRIPTION_ID=$(echo "$AZURE_CREDENTIALS" | jq -r .subscriptionId)
          echo "::add-mask::$CLIENT_SECRET"
          echo "ARM_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$CLIENT_SECRET" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$TENANT_ID" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve -no-color
