name: 05 - Test Production

on:
  workflow_call:

jobs:
  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: production

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Wait for production frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n production \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for production frontend IP..."

            sleep 10
          done

          echo "Unable to find production frontend IP."
          exit 1

      - name: Test frontend
        run: |
          curl \
            --fail \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 10 \
            --retry-delay 5 \
            http://${{ env.FRONTEND_IP }}
