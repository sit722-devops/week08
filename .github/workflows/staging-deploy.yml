# .github/workflows/staging-deploy.yml
name: Staging Deploy

on:
  workflow_run:
    workflows: ["CI - testing"]   # must exactly match name in ci-testing.yml
    types: ["completed"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: week10-rg
          cluster-name: week10-aks

      - uses: actions/checkout@v4

      # Deploy Product Service
      - name: Deploy Product Service
        run: |
          NS=staging-${{ github.run_number }}
          echo "NS=$NS" >> $GITHUB_ENV
          kubectl create namespace $NS || true

          IMAGE=${{ vars.ACR_LOGIN_SERVER }}/product_service:${{ github.event.workflow_run.head_sha }}
          kubectl -n $NS apply -f k8s/base/product-service.yaml
          kubectl -n $NS set image deploy/product-service product-service=$IMAGE

      # Deploy Order Service
      - name: Deploy Order Service
        run: |
          IMAGE=${{ vars.ACR_LOGIN_SERVER }}/order_service:${{ github.event.workflow_run.head_sha }}
          kubectl -n $NS apply -f k8s/base/order-service.yaml
          kubectl -n $NS set image deploy/order-service order-service=$IMAGE

      # Deploy Frontend
      - name: Deploy Frontend
        run: |
          IMAGE=${{ vars.ACR_LOGIN_SERVER }}/frontend:${{ github.event.workflow_run.head_sha }}
          kubectl -n $NS apply -f k8s/base/frontend.yaml
          kubectl -n $NS set image deploy/frontend frontend=$IMAGE

      # Wait for rollout
      - name: Wait for rollout
        run: |
          kubectl -n $NS rollout status deploy/product-service --timeout=300s
          kubectl -n $NS rollout status deploy/order-service --timeout=300s
          kubectl -n $NS rollout status deploy/frontend --timeout=300s

      # Smoke test
      - name: Smoke test
        run: |
          kubectl -n $NS get pods -o wide
          kubectl -n $NS get svc -o wide

      # Cleanup staging
      - name: Cleanup staging
        if: always()
        run: kubectl delete ns $NS --wait=true
