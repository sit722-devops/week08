name: Staging - ephemeral deploy
 
on:
  workflow_run:
    workflows: ["CI_testing"]
    types: ["completed"]
    branches: ["testing"]
 
permissions:
  id-token: write
  contents: read
  actions: read
 
jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
 
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: week10-rg
          cluster-name: week10-aks
 
      - uses: actions/checkout@v4
 
      - name: Create ephemeral namespace
        run: |
          NS=staging-${{ github.run_number }}
          echo "NS=$NS" >> $GITHUB_ENV
          kubectl create namespace $NS
 
      - name: Deploy base manifests
        run: |
          kubectl -n $NS apply -f k8s/base/
         
 
      - name: Override images with commit SHA
        run: |
          IMAGE_SHA=${{ github.event.workflow_run.head_sha }}
          NS=$NS

          kubectl -n $NS set image deploy/product-service-w08e1 product-service-container=week10abhiacr.azurecr.io/product_service:$IMAGE_SHA
          kubectl -n $NS set image deploy/order-service-w08e1 order-service-container=week10abhiacr.azurecr.io/order_service:$IMAGE_SHA
          kubectl -n $NS set image deploy/frontend frontend-container=week10abhiacr.azurecr.io/frontend:$IMAGE_SHA
 
      - name: Wait for rollout
        run: |
          kubectl -n $NS rollout status deploy/product-service-w08e1 --timeout=300s
          kubectl -n $NS rollout status deploy/order-service-w08e1 --timeout=300s
          kubectl -n $NS rollout status deploy/frontend --timeout=300s
 
      - name: Smoke test
        run: |
          kubectl -n $NS get pods -o wide
          kubectl -n $NS get svc -o wide
 
      - name: Cleanup staging
        if: always()
        run: kubectl delete ns $NS --wait=true
