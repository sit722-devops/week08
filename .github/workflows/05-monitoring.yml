name: 05 - Deploy and Validate Monitoring

on:
  # Runs after every successful staging deployment
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

jobs:
  monitoring:
    name: Prometheus + Grafana
    runs-on: ubuntu-latest

    if: >
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --values monitoring/kube-prometheus-stack-values.yaml \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --wait \
            --timeout 10m

      - name: Apply ServiceMonitor and Grafana dashboard
        run: |
          kubectl apply -f monitoring/servicemonitor-koalatech.yaml
          kubectl apply -f monitoring/dashboard-koalatech.yaml

      - name: Wait for monitoring pods
        run: |
          kubectl wait --for=condition=Ready pods --all \
            --field-selector=status.phase!=Succeeded \
            -n monitoring \
            --timeout=300s
          kubectl get pods -n monitoring

      - name: Validate Prometheus is scraping the application
        run: |
          kubectl -n monitoring port-forward svc/prometheus-kube-prometheus-prometheus 9090:9090 > /dev/null 2>&1 &
          sleep 5

          for i in $(seq 1 24); do
            COUNT=$(curl -sG http://localhost:9090/api/v1/query \
              --data-urlencode 'query=up{job=~".+-service"} == 1' \
              | jq '.data.result | length')

            echo "Healthy KoalaTech targets: ${COUNT:-0}"

            if [ "${COUNT:-0}" -ge 5 ]; then
              {
                echo "## Prometheus targets (up == 1)"
                echo ""
                echo "| namespace | service | pod |"
                echo "|---|---|---|"
                curl -sG http://localhost:9090/api/v1/query \
                  --data-urlencode 'query=up{job=~".+-service"} == 1' \
                  | jq -r '.data.result[] | "| \(.metric.namespace) | \(.metric.service) | \(.metric.pod) |"'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            sleep 10
          done

          echo "Prometheus is not scraping the KoalaTech services."
          exit 1

      - name: Validate Grafana and the KoalaTech dashboard
        run: |
          kubectl -n monitoring port-forward svc/prometheus-grafana 3000:80 > /dev/null 2>&1 &
          sleep 5

          curl --fail -s http://localhost:3000/api/health | tee grafana-health.json

          for i in $(seq 1 12); do
            TITLE=$(curl -s -u "admin:${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
              "http://localhost:3000/api/search?query=KoalaTech" | jq -r '.[0].title // empty')
            if [ -n "$TITLE" ]; then
              echo "Dashboard found: $TITLE"
              {
                echo "## Grafana"
                echo ""
                echo "- Health: $(jq -r .database grafana-health.json)"
                echo "- Dashboard provisioned: $TITLE"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done

          echo "KoalaTech dashboard was not provisioned."
          exit 1
