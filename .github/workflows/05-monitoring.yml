name: 05 - Deploy Monitoring

on:
  push:
    branches:
      - 9.3c-frontend-cd-test
  workflow_dispatch:

jobs:
  deploy-monitoring:
    name: Deploy Prometheus and Grafana
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Add Prometheus Helm repository
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Deploy Prometheus and Grafana
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --set prometheus.prometheusSpec.replicas=1 \
            --set prometheus.prometheusSpec.retention=24h \
            --set alertmanager.enabled=false \
            --set grafana.replicas=1 \
            --set grafana.persistence.enabled=false \
            --set grafana.service.type=ClusterIP \
            --wait \
            --timeout 10m

      - name: Verify monitoring deployment
        run: |
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring

      - name: Verify Prometheus
        run: |
          kubectl wait --for=condition=Ready pod/prometheus-monitoring-kube-prometheus-prometheus-0 \
            -n monitoring \
            --timeout=300s

      - name: Verify Grafana
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=grafana \
            -n monitoring \
            --timeout=300s
