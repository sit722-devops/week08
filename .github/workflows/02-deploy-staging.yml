name: 02 - Deploy to Staging

on:
  workflow_run:
    workflows:
      - "01 - CI"
    types:
      - completed
    branches:
      - main

jobs:
  deploy-staging:
    name: Deploy Application and Monitoring to Staging
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create staging namespace
        run: |
          kubectl create namespace staging \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace staging \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace staging \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply staging Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/staging/

      - name: Deploy tested application images
        shell: bash
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"

          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:$IMAGE_TAG \
            -n staging

          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:$IMAGE_TAG \
            -n staging

          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:$IMAGE_TAG \
            -n staging

          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:$IMAGE_TAG \
            -n staging

          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:$IMAGE_TAG \
            -n staging

          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:$IMAGE_TAG \
            -n staging

      - name: Verify application rollouts
        shell: bash
        run: |
          for deployment in \
            frontend \
            user-service \
            student-service \
            lecturer-service \
            course-service \
            enrollment-service
          do
            echo "Checking rollout: $deployment"

            kubectl rollout status deployment/$deployment \
              -n staging \
              --timeout=300s
          done

      - name: Create monitoring namespace
        run: |
          kubectl apply \
            -f kubernetes/monitoring/01-namespace.yaml

      - name: Create Grafana admin secret
        run: |
          kubectl create secret generic grafana-admin \
            --namespace monitoring \
            --from-literal=password="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy Prometheus and Grafana monitoring
        run: |
          kubectl apply \
            -f kubernetes/monitoring/

      - name: Verify monitoring rollouts
        shell: bash
        run: |
          for deployment in \
            kube-state-metrics \
            prometheus \
            grafana
          do
            echo "Checking monitoring deployment: $deployment"

            kubectl rollout status deployment/$deployment \
              -n monitoring \
              --timeout=300s
          done

      - name: Verify Prometheus targets
        shell: bash
        run: |
          kubectl port-forward \
            -n monitoring \
            svc/prometheus \
            9090:9090 > /tmp/prometheus-port-forward.log 2>&1 &

          PF_PID=$!

          cleanup() {
            kill "$PF_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Waiting for Prometheus API..."

          for attempt in {1..20}
          do
            if curl --fail --silent \
              http://127.0.0.1:9090/-/ready > /dev/null
            then
              echo "Prometheus API is ready."
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "Prometheus did not become ready."
              cat /tmp/prometheus-port-forward.log
              exit 1
            fi

            echo "Prometheus API not ready yet - attempt ${attempt}/20"
            sleep 3
          done

          echo
          echo "Waiting for all required Prometheus targets to become healthy..."

          for attempt in {1..12}
          do
            echo
            echo "Target health check ${attempt}/12"

            curl --fail --silent \
              http://127.0.0.1:9090/api/v1/targets \
              > /tmp/prometheus-targets.json

            if python3 - <<'PYTHON'
          import json

          with open("/tmp/prometheus-targets.json") as file:
              data = json.load(file)

          targets = data["data"]["activeTargets"]

          required_jobs = {
              "user-service",
              "student-service",
              "lecturer-service",
              "course-service",
              "enrollment-service",
              "kube-state-metrics",
          }

          target_status = {}

          for target in targets:
              labels = target.get("labels", {})
              job = labels.get("job", "unknown")
              health = target.get("health", "unknown")
              scrape_url = target.get("scrapeUrl", "")
              last_error = target.get("lastError", "")

              if job in required_jobs:
                  target_status[job] = health

                  print(
                      f"{job:25} "
                      f"health={health:8} "
                      f"{scrape_url}"
                  )

                  if last_error:
                      print(f"  error: {last_error}")

          healthy_jobs = {
              job
              for job, health in target_status.items()
              if health == "up"
          }

          missing = required_jobs - healthy_jobs

          if missing:
              print()
              print(
                  "Targets not healthy yet: "
                  + ", ".join(sorted(missing))
              )
              raise SystemExit(1)

          print()
          print("All required Prometheus targets are healthy.")
          PYTHON
            then
              echo
              echo "Prometheus monitoring validation successful."
              exit 0
            fi

            if [ "$attempt" -eq 12 ]; then
              echo
              echo "Required Prometheus targets did not become healthy within 120 seconds."
              exit 1
            fi

            echo "Waiting 10 seconds before retry..."
            sleep 10
          done

      - name: Verify Grafana health
        shell: bash
        run: |
          kubectl port-forward \
            -n monitoring \
            svc/grafana \
            3000:3000 > /tmp/grafana-port-forward.log 2>&1 &

          PF_PID=$!

          cleanup() {
            kill "$PF_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Waiting for Grafana..."

          for attempt in {1..20}
          do
            if curl --fail --silent \
              http://127.0.0.1:3000/api/health
            then
              echo
              echo "Grafana is healthy."
              exit 0
            fi

            sleep 3
          done

          echo "Grafana health validation failed."
          cat /tmp/grafana-port-forward.log
          exit 1

      - name: Show staging resources
        if: always()
        run: |
          echo "===== STAGING PODS ====="
          kubectl get pods -n staging -o wide

          echo
          echo "===== STAGING SERVICES ====="
          kubectl get services -n staging

          echo
          echo "===== STAGING PVCs ====="
          kubectl get pvc -n staging

      - name: Show monitoring resources
        if: always()
        run: |
          echo "===== MONITORING DEPLOYMENTS ====="
          kubectl get deployments -n monitoring

          echo
          echo "===== MONITORING PODS ====="
          kubectl get pods -n monitoring -o wide

          echo
          echo "===== MONITORING SERVICES ====="
          kubectl get services -n monitoring
