
name: 02 - Deploy to Staging

on:
  workflow_run:
    workflows:
      - "01 - CI"
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full commit SHA from a successful CI build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}

    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}

    steps:
      # 1. Checkout the tested commit
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      # 2. Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Connect to AKS
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      # 4. Create staging namespace
      - name: Create staging namespace
        run: |
          kubectl create namespace staging \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # 5. Create PostgreSQL secret
      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace staging \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # 6. Create application secret
      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace staging \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # 7. Apply Kubernetes manifests
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/staging/

      # 8. Update frontend image
      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend="${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${IMAGE_TAG}" \
            -n staging

      # 9. Update user-service image
      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service="${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${IMAGE_TAG}" \
            -n staging

      # 10. Update student-service image
      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service="${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${IMAGE_TAG}" \
            -n staging

      # 11. Update lecturer-service image
      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service="${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${IMAGE_TAG}" \
            -n staging

      # 12. Update course-service image
      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service="${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${IMAGE_TAG}" \
            -n staging

      # 13. Update enrollment-service image
      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service="${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${IMAGE_TAG}" \
            -n staging

      # 14. Verify frontend rollout
      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n staging \
            --timeout=300s

      # 15. Verify user-service rollout
      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n staging \
            --timeout=300s

      # 16. Verify student-service rollout
      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n staging \
            --timeout=300s

      # 17. Verify lecturer-service rollout
      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n staging \
            --timeout=300s

      # 18. Verify course-service rollout
      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n staging \
            --timeout=300s

      # 19. Verify enrollment-service rollout
      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n staging \
            --timeout=300s

      # 20. Display staging resources
      - name: Show staging resources
        run: |
          kubectl get pods -n staging
          kubectl get services -n staging
          kubectl get pvc -n staging
