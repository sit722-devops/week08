name: 05 - Deploy Monitoring

on:
  push:
    branches:
      - main
    paths:
      - "kubernetes/monitoring/**"
      - ".github/workflows/05-deploy-monitoring.yml"

  workflow_dispatch:

jobs:
  deploy-monitoring:
    name: Deploy Prometheus & Grafana
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.1"

      - name: Add Prometheus community Helm repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # Idempotent: installs the stack if it doesn't exist yet, or
      # reconciles it to match this config if it's already deployed.
      - name: Deploy kube-prometheus-stack
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --wait \
            --timeout 10m

      - name: Verify monitoring pods are healthy
        run: |
          kubectl get pods -n monitoring
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=grafana \
            -n monitoring \
            --timeout=180s
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=prometheus \
            -n monitoring \
            --timeout=180s
