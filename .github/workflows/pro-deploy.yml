# .github/workflows/prod-deploy.yml
name: Prod - deploy

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: week10-rg
          cluster-name: week10-aks

      - uses: actions/checkout@v4

      - name: Ensure production namespace
        run: |
          kubectl get ns production || kubectl create ns production

      # Deploy Product Service
      - name: Deploy Product Service
        run: |
          IMAGE=week10abhiacr.azurecr.io/product_service:${{ github.sha }}
          kubectl -n production apply -f k8s/base/product-service.yaml
          kubectl -n production set image deploy/product-service product-service=$IMAGE
          kubectl -n production rollout status deploy/product-service --timeout=300s

      # Deploy Order Service
      - name: Deploy Order Service
        run: |
          IMAGE=week10abhiacr.azurecr.io/order_service:${{ github.sha }}
          kubectl -n production apply -f k8s/base/order-service.yaml
          kubectl -n production set image deploy/order-service order-service=$IMAGE
          kubectl -n production rollout status deploy/order-service --timeout=300s

      # Deploy Frontend
      - name: Deploy Frontend
        run: |
          IMAGE=week10abhiacr.azurecr.io/frontend:${{ github.sha }}
          kubectl -n production apply -f k8s/base/frontend.yaml
          kubectl -n production set image deploy/frontend frontend=$IMAGE
          kubectl -n production rollout status deploy/frontend --timeout=300s
