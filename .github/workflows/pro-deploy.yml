name: Prod - deploy
 
on:
  push:
    branches: ["main"]
 
permissions:
  id-token: write
  contents: read
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
 
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: week10-rg
          cluster-name: week10-aks
 
      - uses: actions/checkout@v4
 
      - name: Compute prod image
        run: |
          IMAGE=week10abhiacr.azurecr.io/app:${{ github.sha }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
 
      - name: Ensure production namespace
        run: |
          kubectl get ns production || kubectl create ns production
 
      - name: Apply manifests
        run: |
          kubectl -n production apply -f k8s/base
          kubectl -n production set image deploy/app app=$IMAGE
 
      - name: Wait for rollout
        run: kubectl -n production rollout status deploy/app --timeout=300s